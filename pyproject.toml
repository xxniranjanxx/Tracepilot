[project]
name = "tracepilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "xxniranjanxx", email = "niranjan.nand@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.162.7",
    "langchain-core>=1.8.1",
    "pandas>=3.1.1",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
tracepilot = "tracepilot:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
